AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  ICAA Assets API

Parameters:
  architecture:
    Description: Architecture to run on
    Type: String
    Default: x86_64
    AllowedValues:
      - arm64
      - x86_64
Mappings:
  attributes:
    dynamo:
      tableName: assets-api
    s3:
      bucketName: assets.icaa.world

Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Environment:
      Variables:
        DYNAMO_TABLE_NAME: !FindInMap [attributes, dynamo, tableName]
        S3_BUCKET_NAME: !FindInMap [attributes, s3, bucketName]
        ASSETS_CDN_BASE_URL: https://assets.icaa.world

Resources:
  AssetsHttpApi:
    Type: AWS::Serverless::HttpApi

  AssetsApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Properties:
      DomainName: api.icaa.world
      ApiId: !Ref AssetsHttpApi
      Stage: !Ref AssetsHttpApi.Stage
      ApiMappingKey: assets

  ICAAAssets:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures:
        - !Ref architecture
      Policies:
        - Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:Scan
            Resource:
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/assets-api"
          - Effect: Allow
            Action:
              - ssm:GetParameter
            Resource:
              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/jwtSigningKeys"
              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/newrelic-license-key"
          - Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:DeleteObject
              - s3:HeadObject
            Resource:
              - !Sub "arn:aws:s3:::${AssetsBucket}/*"
      Events:
        APIEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref AssetsHttpApi
            Path: '/{proxy+}'
            Method: ANY
    Metadata:
      DockerTag: v1
      DockerContext: .
      Dockerfile: Dockerfile

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ICAAAssets}
      RetentionInDays: 30

  AssetsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !FindInMap [attributes, s3, bucketName]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - PUT
            AllowedOrigins:
              - "https://icaa.world"
              - "https://*.icaa.world"
            MaxAge: 3600

  AssetsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AssetsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${AssetsBucket}/*"

  AssetsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !FindInMap [attributes, dynamo, tableName]
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: TTL
        Enabled: True

Outputs:
  AssetsApiEndpoint:
    Description: API Gateway endpoint URL for Assets API
    Value: !Sub "https://${AssetsHttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
  AssetsBucketName:
    Description: Name of the S3 bucket for assets
    Value: !Ref AssetsBucket
  AssetsBucketArn:
    Description: ARN of the S3 bucket for assets
    Value: !GetAtt AssetsBucket.Arn

# Deploys to production on merge to main. Auth is OIDC (no stored AWS keys);
# see deploy/README.md for the one-time role setup.

name: Deploy
permissions:
  contents: read
  id-token: write

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: prod-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TEST_IN_CI: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.27'

    - name: Start MinIO
      run: |
        docker run -d --name minio -p 9000:9000 \
          -e MINIO_ROOT_USER=minioadmin \
          -e MINIO_ROOT_PASSWORD=minioadmin \
          pgsty/silo:RELEASE.2026-10-18T00-00-00Z server /data

    - name: Wait for MinIO
      run: |
        for i in $(seq 1 30); do
          if curl -sf http://localhost:9000/minio/health/live; then
            echo "MinIO is ready"
            break
          fi
          echo "Waiting for MinIO... attempt $i"
          sleep 2
        done

    - name: Generate
      run: go generate -v ./...

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

    - name: Set up SAM CLI
      uses: aws-actions/setup-sam@v2

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        # Not a secret: the trust policy only allows this repo's main branch
        # via GitHub OIDC, so the ARN alone grants nothing.
        role-to-assume: arn:aws:iam::197461532156:role/assets-api-github-deploy
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to ECR Public
      run: aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws

    - name: SAM build
      run: sam build --parameter-overrides architecture=x86_64

    - name: SAM deploy
      run: sam deploy --no-confirm-changeset --no-fail-on-empty-changeset
